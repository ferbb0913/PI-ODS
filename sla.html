<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

</head>
<style>

button{
    cursor: pointer;
    background: #8ca7ff;
    background: linear-gradient(0deg, rgba(140, 167, 255, 1) 1%, rgba(71, 99, 255, 1) 6%, rgba(0, 15, 230, 1) 28%, rgba(140, 230, 255, 1) 98%, rgba(227, 243, 255, 1) 99%);
    border-radius: 7px;
    box-shadow: 0 4px 8px 0 rgba(59, 64, 79, 0.784);
    color: white;
    padding: 10px;
    font-size: 16px;
}

button:hover {
   
    
    text-shadow: #020024 0px 0px 10px, #020024 0px 0px 20px, #020024 0px 0px 30px, #020024 0px 0px 40px, #020024 0px 0px 50px, #020024 0px 0px 60px, #020024 0px 0px 70px, #020024 0px 0px 80px, #020024 0px 0px 90px;
}

 input[type="button"] {
    cursor: pointer;
    background: #8ca7ff;
    background: linear-gradient(0deg, rgba(140, 167, 255, 1) 1%, rgba(71, 99, 255, 1) 6%, rgba(0, 15, 230, 1) 28%, rgba(140, 230, 255, 1) 98%, rgba(227, 243, 255, 1) 99%);
    border-radius: 7px;
    box-shadow: 0 4px 8px 0 rgba(59, 64, 79, 0.784);
    color: white;
    padding: 10px;
    font-size: 16px;

}





input[type="button"]:hover {
   
    
    text-shadow: #020024 0px 0px 10px, #020024 0px 0px 20px, #020024 0px 0px 30px, #020024 0px 0px 40px, #020024 0px 0px 50px, #020024 0px 0px 60px, #020024 0px 0px 70px, #020024 0px 0px 80px, #020024 0px 0px 90px;
}

body
{   
    font-family: Arial, Helvetica, sans-serif;
    background: #020024;
    background: linear-gradient(90deg, rgba(2, 0, 36, 1) 0%, rgba(9, 9, 121, 1) 35%, rgba(0, 212, 255, 1) 100%);
    margin: 0;
    padding: 0;}


    section{
        text-align: center;
        width: 50%;
        margin: 90px auto 90px auto;
        margin-bottom: 90px;
        height: auto;
        border-radius: 3%;
        background: #8ca7ff;
        box-shadow: 0 4px 8px 0 rgba(59, 64, 79, 0.852);
        background: linear-gradient(0deg, rgba(140, 167, 255, 1) 1%, rgba(71, 99, 255, 1) 6%, rgba(0, 15, 230, 1) 28%, rgba(140, 230, 255, 1) 98%, rgba(227, 243, 255, 1) 99%);
    }


    
.popup {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background-color: rgba(0,0,0,0.5);
}

.popup-content {
  background: white;
  padding: 20px;
  margin: 100px auto;
  width: 300px;
  border-radius: 10px;
}

.close {
  float: right;
  cursor: pointer;
  font-size: 20px;
}

</style>
<body>
    

<section>
<br><br>
<input type="button" id="botao1" value="Botão de alerta">
<br><br>
<input type="button" id="botao2" value="mudar texto">
<br><br>
<input type="button" id="botao3" value="Diminuir/aumentar">
<br><br>
<input type="button" id="botao5" value="Mudar cor">
<h1 id="demo2">mudar texto</h1>

<br><br>
<form>

<button onclick="apresentaUser()">Entrar</button>
<h1 id="demo6">Nome</h1>
<h1 id="demo3">Idade</h1>


<button onclick="popup(); return false;">Calculadora</button>
<br><br><br>
<div id="popup" class="popup">
  <div class="popup-content">
    <span class="close" onclick="fecharPopup()">&times;</span>

    <h2>Calculadora</h2>
    <p>Digite dois números:</p>

    <label>Primeiro número:</label>
    <input type="number" id="num1"><br>

    <label>Segundo número:</label>
    <input type="number" id="num2"><br><br>

    <button type="button" onclick="somar()">+</button><br><br>
    <button type="button" onclick="diminuir()">-</button><br><br>
    <button type="button"onclick="multiplicar()">X</button><br><br>
    <button type="button"onclick="dividir()">/</button><br><br>

    <label>Resultado:</label>
    <input type="text" id="num3">
  </div>
</div>

 <h2>Calculadora de dias</h2>
 
    <label>Quantos dias entre hoje e a data escolhida:</label>
    <br>
    <input type="date" id="dataescolhida">
    <br><br>
 
    <button type="button" onclick="calculardias()">Calcular</button>
    <h3 id="resultado"></h3>


</form>
</section>
